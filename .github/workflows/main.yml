
name: Frontend Angular CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitLab repository
        uses: actions/checkout@v4
        with:
          repository: MedGreecy/pfe
          ref: master
          token: ${{ secrets.GITLAB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app1/package-lock.json

      - name: Install Angular dependencies
        working-directory: app1
        run: npm ci

      - name: Build Angular application
        working-directory: app1
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t mghr/frontendpfe:latest ./app1

      - name: Push to Docker Hub
        run: docker push mghr/frontendpfe:latest
